<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Generador de Boletines SOC{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Paleta base */
    :root {
      --bg: #0a0f1c;          /* Fondo general */
      --card: #112240;        /* Fondo de tarjetas */
      --accent: #00b4d8;      /* Color de acento (botones, enlaces) */
      --accent-hover: #0096c7;/* Hover de botones */
      --text: #f1f5f9;        /* Texto principal */
      --muted: #9ca3af;       /* Texto secundario */
      --header-bg: #ffffff;   /* Encabezado blanco */
      --header-text: #0a0f1c; /* Texto oscuro en encabezado */
    }

    /* Fondo general */
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f1c 0%, #0f2027 40%, #203a43 100%);
      color: var(--text);
      min-height: 100vh;
    }

    /* Encabezado */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background-color: var(--header-bg);
      color: var(--header-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--header-text);
      letter-spacing: 0.5px;
    }

    main {
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Botones */
    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.6);
      transform: translateY(-1px);
    }

    .btn.secondary {
      background-color: #22304d;
      color: var(--text);
    }

    /* Tarjetas */
    .card {
      background-color: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    /* Campo numérico */
    .input {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--accent);
      padding: 6px 8px;
      border-radius: 6px;
      width: 60px;
      text-align: center;
    }

    /* Pantalla de carga */
    .loading {
      display: none;
      background-color: rgba(0,0,0,0.6);
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.3rem;
      z-index: 999;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success {
      background-color: #2d6a4f;
      color: white;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }

    /*Bienvenida*/
.welcome-box{
  background: linear-gradient(
    135deg,
    #0e2a47,
    #133b5c
  );
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 14px;
  padding: 40px 30px;
  text-align: center;
  color: #fff;
  max-width: 900px;
  margin: 30px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
}


.welcome-logos{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 70px;
  margin-bottom: 18px;
}

.welcome-logos img{
  height: 100px;
  width: auto;
  opacity: .95;
}

.welcome-box h2{
  margin: 10px 0 12px;
}

.welcome-box p{
  margin: 0 auto;
  max-width: 720px;
  line-height: 1.6;
  opacity: .95;
}

.welcome-hint{
  margin-top: 18px;
  font-size: 0.95rem;
  opacity: .9;
  background: rgba(0, 180, 216, .12);
  border: 1px solid rgba(0, 180, 216, .25);
  padding: 10px 14px;
  border-radius: 10px;
  display: inline-block;
}


  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Generando boletines...
  </div>

  {% block content %}{% endblock %}

  <script>
    // Mostrar animación de carga
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', () => {
        document.getElementById('loading').style.display = 'flex';
      });
    }

    // Mostrar mensaje de éxito si Flask lo envía
    window.addEventListener("load", () => {
      const msg = document.getElementById("success-msg");
      if (msg && msg.textContent.trim() !== "") {
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 4000);
      }
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
